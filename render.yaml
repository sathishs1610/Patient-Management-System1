# Render Blueprint for Patient Management System
# Docs: https://render.com/docs/blueprint-spec
# The frontend VITE_API_URL must match the backend's onrender.com URL.
# If your backend service name changes, update VITE_API_URL below too.

databases:
  - name: patient-db
    plan: free
    databaseName: patient_management
    user: patient_user

services:
  # ---------- Backend (NestJS) ----------
  - type: web
    name: patient-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_HOST
        fromDatabase:
          name: patient-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: patient-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: patient-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: patient-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: patient-db
          property: database
      # Set these two in the Render dashboard (do not commit real keys)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ---------- Frontend (Vite static site) ----------
  - type: web
    name: patient-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://patient-backend.onrender.com
    routes:
      # SPA rewrite so React Router client-side routes work on refresh
      - type: rewrite
        source: /*
        destination: /index.html